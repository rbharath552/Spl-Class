
<html>
<head>
    <title>Product Price Calculator</title>
</head>
<body>

    <h2>Product Price Calculator</h2>

    <form id="productForm">
        <label>Product Name:</label><br>
        <input type="text" id="productName" required><br><br>

        <label>Price:</label><br>
        <input type="number" id="price" required><br><br>

        <label>Quantity:</label><br>
        <input type="number" id="quantity" required><br><br>

        <button type="submit">Calculate Total</button>
    </form>

    <h3 id="result"></h3>
    <h3 id="discount"></h3>

    <script>
        document.getElementById("productForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const productName = document.getElementById("productName").value;
            const price = Number(document.getElementById("price").value);
            const quantity = Number(document.getElementById("quantity").value);

            const total = price * quantity;

            document.getElementById("result").textContent =
                `Product: ${productName} | Total Amount: ₹${total}`;

            if (total > 5000) {
                document.getElementById("discount").textContent =
                    "Discount Eligible";
            } else {
                document.getElementById("discount").textContent =
                    "Not Eligible for Discount";
            }
        });
    </script>

</body>
</html>
